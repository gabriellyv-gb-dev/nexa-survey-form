<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        Nexa
    </title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <main class="hero-section">
        <div class="text-survey-form">
            <h1>
                Nexa Survey Form
            </h1>
            <span>
                Thank you for taking the time to help us improve the platform.
            </span>
        </div>

        <div class="form-modal">
            <div class="registration-inputs">
                <div class="input-name">
                    <label for="name">
                        Name
                    </label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-email">
                    <label for="email">
                        Email
                    </label>
                    <input type="text" placeholder="Enter your email">
                </div>

                <div class="input-age">
                    <label for="age">
                        Age (optional)
                    </label>
                    <input type="text" placeholder="Age">
                </div>
            </div>

            <div class="checkbox-">
                <div class="round-checkbox-recommend">
                    <h2>
                        Would you recommend Nexa to a friend?
                    </h2>

                    <input type="checkbox">
                    <label for="">
                        Definitely
                    </label>

                    <input type="checkbox">
                    <label for="">
                        Maybe
                    </label>

                    <input type="checkbox">
                    <label for="">
                        Not sure
                    </label>
                </div>
            </div>

            <div class="select-functionality-issues">
                <h2>
                    What is your favorite feature of Nexa?
                </h2>
                <select name="Select" id="Select">
                    <option value="">Select an option</option>
                    <option value="challenges">Challenges</option>
                    <option value="projects">Projects</option>
                    <option value="community">Community</option>
                    <option value="open source">Open Source</option>
                </select>
            </div>

            <div class="checkbox-like-improved">
                <h2>
                    What would you like to see improved? (Check all that apply)
                </h2>

                <input type="checkbox">
                <label for="">
                    Front-end Projects
                </label>

                <input type="checkbox">
                <label for="">
                    Back-end Projects
                </label>

                <input type="checkbox">
                <label for="">
                    Data Visualization
                </label>

                <input type="checkbox">
                <label for="">
                    Challenges
                </label>

                <input type="checkbox">
                <label for="">
                    Open Source Community
                </label>

                <input type="checkbox">
                <label for="">
                    Gitter help rooms
                </label>

                <input type="checkbox">
                <label for="">
                    Videos
                </label>

                <input type="checkbox">
                <label for="">
                    City Meetups
                </label>

                <input type="checkbox">
                <label for="">
                    Wiki
                </label>

                <input type="checkbox">
                <label for="">
                    Forum
                </label>

                <input type="checkbox">
                <label for="">
                    Additional Courses
                </label>
            </div>

            <div class="users-suggestions">
                <h3>
                   Any comments or suggestions? 
                </h3>
                <textarea name="suggestions" id="suggestions">
                    Enter your comment here...
                </textarea>
            </div>

            <div class="button-submit">
                <button>
                    Submit
                </button>
            </div>
        </div>
    </main>
</body>
</html>
