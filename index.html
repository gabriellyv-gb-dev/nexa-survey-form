<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        Nexa
    </title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/reset.css">

</head>
<body>
    <main class="hero-section">
        <div class="text-survey-form">
            <h1>
                Nexa Survey Form
            </h1>
            <span>
                Thank you for taking the time to help <br>
                us improve the platform.
            </span>
        </div>

        <div class="form-modal">
            <div class="registration-inputs">
                <div class="input-name">
                    <label for="name">
                        Name
                    </label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-email">
                    <label for="email">
                        Email
                    </label>
                    <input type="text" placeholder="Enter your email">
                </div>

                <div class="input-age">
                    <label for="age">
                        Age (optional)
                    </label>
                    <input type="text" placeholder="Age">
                </div>
            </div>

            <div class="round-checkbox-recommend">
                <h2>
                    Would you recommend <br> 
                    Nexa to a friend?
                </h2>

                <div>
                    <input type="radio">
                    <label for="Definitely">
                        Definitely
                    </label>
                </div>

                <div>
                    <input type="radio">
                    <label for="Maybe">
                        Maybe
                    </label>
                </div>

                <div>
                    <input type="radio">
                    <label for="Not sure">
                        Not sure
                    </label>
                </div>
            </div>

            <div class="select-functionality-issues">
                <h2>
                    What is your favorite feature of Nexa?
                </h2>
                <select name="Select" id="Select">
                    <option value="">Select an option</option>
                    <option value="challenges">Challenges</option>
                    <option value="projects">Projects</option>
                    <option value="community">Community</option>
                    <option value="open source">Open Source</option>
                </select>
            </div>

            <div class="checkbox-like-improved">
                <h2>
                    What would you like to see improved? (Check all that apply)
                </h2>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Front-end Projects
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Back-end Projects
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Data Visualization
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Challenges
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Open Source Community
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Gitter help rooms
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Videos
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        City Meetups
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Wiki
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Forum
                    </label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">
                        Additional Courses
                    </label>
                </div>
            </div>

            <div class="users-suggestions">
                <h3>
                   Any comments or suggestions? 
                </h3>
                <textarea name="suggestions" id="suggestions">
                    Enter your comment here...
                </textarea>

                <div class="button-submit">
                    <button>
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
